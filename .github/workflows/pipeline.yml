name: pipeline

# Ejecuta el lakehouse completo y publica la capa de serving.
#
# El cómputo vive aquí y no en el entorno desplegado: los runners públicos de
# GitHub traen 4 vCPU / 16 GB y minutos ilimitados, y tienen JDK Temurin
# precacheado. El dashboard sólo consume el artefacto resultante (~26 MB), así
# que puede desplegarse en un entorno sin JVM.

on:
  workflow_dispatch:
    inputs:
      skip_models:
        description: "Omitir el reentrenamiento de modelos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/landing/**"
      - "src/pipeline/**"
      - "requirements-pipeline.txt"
  schedule:
    # Lunes 04:00 UTC — mantiene el artefacto fresco y el workflow vivo.
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # El runner tiene 16 GB; 6 GB al driver deja margen para la JVM y el SO.
      SPARK_DRIVER_MEMORY: 6g
      SPARK_SHUFFLE_PARTITIONS: "8"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restaurar objetos LFS
        run: git lfs pull

      - uses: actions/setup-java@v4
        with:
          # PySpark 3.5 soporta oficialmente hasta Java 17.
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependencias del pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Diagnóstico del entorno
        run: python -m src.pipeline.run --doctor

      - name: Ejecutar el lakehouse
        run: |
          python -m src.pipeline.run --step bronze
          python -m src.pipeline.run --step silver
          python -m src.pipeline.run --step gold
          ${{ inputs.skip_models && 'echo "modelos omitidos"' || 'python -m src.pipeline.run --step models' }}

      - name: Validar contratos de datos
        run: python -m src.pipeline.quality --report quality-report.json

      - name: Exportar la capa de serving
        run: python -m src.pipeline.export_serving --out dist/serving.duckdb

      - name: Resumen de la corrida
        run: |
          {
            echo "### Lakehouse reconstruido"
            echo ""
            echo "| Artefacto | Tamaño |"
            echo "|---|---|"
            echo "| serving.duckdb | $(du -h dist/serving.duckdb | cut -f1) |"
            echo ""
            echo '```json'
            cat quality-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: serving-duckdb
          path: dist/serving.duckdb
          retention-days: 30

      - name: Publicar como release rodante
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: serving-latest
          name: "Capa de serving (última)"
          body: |
            Artefacto DuckDB que consume el dashboard.
            Generado por `pipeline.yml` desde el commit ${{ github.sha }}.
          files: dist/serving.duckdb
          prerelease: false
          make_latest: false
